[package]
name = "ntpanic"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "Panic handler for Windows kernel-mode Rust drivers: reports the panic, then bug-checks the system."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/krakenaut9/ntpanic"
documentation = "https://docs.rs/ntpanic"
keywords = ["panic-handler", "windows", "kernel", "driver", "wdk"]
categories = ["no-std", "no-std::no-alloc", "os::windows-apis", "development-tools::debugging"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE*"]
authors = ["Dmytro Maslo <krakenaut9@gmail.com>"]

[dependencies]
windows-link = "0.2"
windows-sys = { version = "0.61", features = [ "Wdk", "Wdk_System", "Wdk_System_SystemServices" ] }

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc", "aarch64-pc-windows-msvc"]
